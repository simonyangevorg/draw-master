version: "3.9"

services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis_secret
      POSTGRES_MULTIPLE_DATABASES: players,tournaments,matches,stats,notifications
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tennis
      RABBITMQ_DEFAULT_PASS: tennis_secret
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Services ──────────────────────────────────────────────────────────────

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tennis:tennis_secret@postgres:5432/auth
      JWT_SECRET: fptc_super_secret_change_in_prod
      RABBITMQ_URL: amqp://tennis:tennis_secret@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8006:8000"

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - player-service
      - tournament-service
      - match-service
      - stats-service
      - notification-service
      - auth-service

  player-service:
    build: ./player-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tennis:tennis_secret@postgres:5432/players
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://tennis:tennis_secret@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8000"

  tournament-service:
    build: ./tournament-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tennis:tennis_secret@postgres:5432/tournaments
      JWT_SECRET: fptc_super_secret_change_in_prod
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://tennis:tennis_secret@rabbitmq:5672
      PLAYER_SERVICE_URL: http://player-service:8000
      STATS_SERVICE_URL: http://stats-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8002:8000"

  match-service:
    build: ./match-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tennis:tennis_secret@postgres:5432/matches
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://tennis:tennis_secret@rabbitmq:5672
      PLAYER_SERVICE_URL: http://player-service:8000
      TOURNAMENT_SERVICE_URL: http://tournament-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8003:8000"

  stats-service:
    build: ./stats-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tennis:tennis_secret@postgres:5432/stats
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://tennis:tennis_secret@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8004:8000"

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tennis:tennis_secret@postgres:5432/notifications
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://tennis:tennis_secret@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8005:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
