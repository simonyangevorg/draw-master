server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints everything under /assets/ (index-<hash>.js), so those
    # files can be cached for good: a new build gets new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and the SPA fallback) must be revalidated every time, or a
    # browser keeps loading the previous release's bundle after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
