events {
    worker_connections 1024;
}

http {
    upstream auth_service        { server auth-service:8000; }
    upstream tournament_service  { server tournament-service:8000; }
    upstream stats_service       { server stats-service:8000; }
    upstream notification_service { server notification-service:8000; }
    upstream frontend            { server frontend:3000; }

    # ── Real client IP (B-15) ───────────────────────────────────────────
    # In production a host-level proxy terminates TLS in front of this
    # gateway, so the TCP peer is that proxy (or Docker's bridge), never the
    # player. Walk X-Forwarded-For back past private/loopback hops to the
    # first public address: that is the client. Spoofed entries a client adds
    # sit to the left of the real one and are ignored. $remote_addr is then
    # the real client, and it is all we forward (proxy_params.conf).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Coarse per-client limit on the unauthenticated auth endpoints, ahead of
    # auth-service's own per-endpoint throttles (B-15).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;

    # The web SPA is served same-origin through this gateway and needs no CORS
    # headers. The packaged Capacitor app has no origin of its own (WebView
    # loads it from a fixed virtual host) and calls this gateway cross-origin,
    # so its known origins are allowlisted here.
    map $http_origin $cors_origin {
        default                 "";
        "https://localhost"     $http_origin;
        "capacitor://localhost" $http_origin;
        "http://localhost"      $http_origin;
    }

    server {
        listen 80;

        # Redirects stay relative, so they keep the public scheme, host and
        # port instead of nginx's own :80 (B-16).
        absolute_redirect off;

        # The API prefixes work without their trailing slash too, for every
        # method (an internal rewrite, not a redirect a POST would not survive).
        rewrite ^/api/(auth|tournaments|stats|notifications)$ /api/$1/ last;

        # Errors raised by the gateway itself are JSON like the services' (B-16).
        error_page 401 = @json401;
        error_page 429 = @json429;
        location @json401 {
            default_type application/json;
            return 401 '{"statusCode":401,"message":"Unauthorized"}';
        }
        location @json429 {
            default_type application/json;
            return 429 '{"statusCode":429,"message":"Too many attempts, try again in a minute."}';
        }

        # ── Security headers (applied to every response) ────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # unsafe-inline/unsafe-eval and ws: are required by Vite's dev-mode HMR client
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:" always;

        # ── Internal JWT validation subrequest ─────────────────────────────
        # nginx calls this before forwarding any /api/ request (except /api/auth/).
        # auth-service returns:
        #   200 + X-User-* headers  → valid token
        #   200, no headers         → no token (public request)
        #   401                     → forged / expired token → nginx blocks
        location = /_auth_validate {
            internal;
            proxy_pass              http://auth_service/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length   "";
            proxy_set_header        X-Original-URI   $request_uri;
            proxy_set_header        Authorization    $http_authorization;
        }

        # ── Shared header hardening (applied via include in each API block) ─
        # Defined as a snippet below and reused via map variables.

        # ── auth/validate is for internal nginx auth_request use only ───────
        location = /api/auth/validate {
            deny all;
        }

        # ── Auth service — no JWT gate (login / register live here) ────────
        # auth-service sets its own CORS headers (see ALLOWED_ORIGINS env var
        # / app.enableCors in main.ts) — do not also add cors_params.conf here,
        # it would duplicate Access-Control-Allow-Origin and browsers reject
        # responses with more than one value for that header.
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://auth_service/auth/;
            include /etc/nginx/proxy_params.conf;
            # Strip any internal headers a client might inject
            proxy_set_header X-User-Sub   "";
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Name  "";
            proxy_set_header X-User-Role  "";
            proxy_set_header X-User-Clubs "";
        }

        # ── Tournament service ──────────────────────────────────────────────
        # Routes inside the service live at /tournaments/*, so proxy_pass must
        # preserve that segment: /api/tournaments/X → /tournaments/X
        location /api/tournaments/ {
            include /etc/nginx/cors_params.conf;
            auth_request /_auth_validate;

            # Capture decoded claims from the validation subrequest
            auth_request_set $x_user_sub   $upstream_http_x_user_sub;
            auth_request_set $x_user_email $upstream_http_x_user_email;
            auth_request_set $x_user_name  $upstream_http_x_user_name;
            auth_request_set $x_user_role  $upstream_http_x_user_role;
            auth_request_set $x_user_clubs $upstream_http_x_user_clubs;

            # Strip anything the client injects, then re-set from trusted source
            proxy_set_header X-User-Sub   $x_user_sub;
            proxy_set_header X-User-Email $x_user_email;
            proxy_set_header X-User-Name  $x_user_name;
            proxy_set_header X-User-Role  $x_user_role;
            # Club seats, "clubId:A,clubId:M" (A = admin), for L-06 access rules
            proxy_set_header X-User-Clubs $x_user_clubs;
            proxy_set_header x-organiser-id "";

            proxy_pass http://tournament_service/tournaments/;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Stats service ───────────────────────────────────────────────────
        location /api/stats/ {
            include /etc/nginx/cors_params.conf;
            # Public, read-only. Results reach stats-service only through
            # RabbitMQ, so any write from outside is forged → 403.
            limit_except GET OPTIONS { deny all; }
            proxy_pass http://stats_service/stats/;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header X-User-Sub  "";
            proxy_set_header X-User-Role "";
            proxy_set_header X-User-Clubs "";
        }

        # ── Notification service ────────────────────────────────────────────
        # Creating notifications is internal-only (services on the Docker
        # network); from outside it would let anyone message any user.
        location = /api/notifications/notify {
            return 403;
        }

        location /api/notifications/ {
            include /etc/nginx/cors_params.conf;
            auth_request /_auth_validate;

            auth_request_set $x_user_sub  $upstream_http_x_user_sub;

            proxy_set_header X-User-Sub  $x_user_sub;
            proxy_set_header X-User-Role  "";
            proxy_set_header X-User-Clubs "";
            proxy_set_header x-organiser-id "";

            proxy_pass http://notification_service/notifications/;
            include /etc/nginx/proxy_params.conf;
        }

        # Any other /api/ path (including the retired /api/players/, L-18) is a
        # JSON 404, never the SPA's index.html.
        location /api/ {
            default_type application/json;
            return 404 '{"statusCode":404,"message":"Not found"}';
        }

        # ── Frontend (catch-all) ────────────────────────────────────────────
        location / {
            proxy_pass http://frontend/;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
