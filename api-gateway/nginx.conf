events {
    worker_connections 1024;
}

http {
    upstream auth_service        { server auth-service:8000; }
    upstream player_service      { server player-service:8000; }
    upstream tournament_service  { server tournament-service:8000; }
    upstream match_service       { server match-service:8000; }
    upstream stats_service       { server stats-service:8000; }
    upstream notification_service { server notification-service:8000; }
    upstream frontend            { server frontend:3000; }

    server {
        listen 80;

        # ── Security headers (applied to every response) ────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # unsafe-inline/unsafe-eval and ws: are required by Vite's dev-mode HMR client
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:" always;

        # ── Internal JWT validation subrequest ─────────────────────────────
        # nginx calls this before forwarding any /api/ request (except /api/auth/).
        # auth-service returns:
        #   200 + X-User-* headers  → valid token
        #   200, no headers         → no token (public request)
        #   401                     → forged / expired token → nginx blocks
        location = /_auth_validate {
            internal;
            proxy_pass              http://auth_service/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length   "";
            proxy_set_header        X-Original-URI   $request_uri;
            proxy_set_header        Authorization    $http_authorization;
        }

        # ── Shared header hardening (applied via include in each API block) ─
        # Defined as a snippet below and reused via map variables.

        # ── Auth service — no JWT gate (login / register live here) ────────
        location /api/auth/ {
            proxy_pass http://auth_service/auth/;
            include /etc/nginx/proxy_params.conf;
            # Strip any internal headers a client might inject
            proxy_set_header X-User-Sub   "";
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Name  "";
            proxy_set_header X-User-Role  "";
        }

        # ── Tournament service ──────────────────────────────────────────────
        # Routes inside the service live at /tournaments/*, so proxy_pass must
        # preserve that segment: /api/tournaments/X → /tournaments/X
        location /api/tournaments/ {
            auth_request /_auth_validate;

            # Capture decoded claims from the validation subrequest
            auth_request_set $x_user_sub   $upstream_http_x_user_sub;
            auth_request_set $x_user_email $upstream_http_x_user_email;
            auth_request_set $x_user_name  $upstream_http_x_user_name;
            auth_request_set $x_user_role  $upstream_http_x_user_role;

            # Strip anything the client injects, then re-set from trusted source
            proxy_set_header X-User-Sub   $x_user_sub;
            proxy_set_header X-User-Email $x_user_email;
            proxy_set_header X-User-Name  $x_user_name;
            proxy_set_header X-User-Role  $x_user_role;
            proxy_set_header x-organiser-id "";

            proxy_pass http://tournament_service/tournaments/;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Player service ──────────────────────────────────────────────────
        location /api/players/ {
            auth_request /_auth_validate;

            auth_request_set $x_user_sub   $upstream_http_x_user_sub;
            auth_request_set $x_user_role  $upstream_http_x_user_role;

            proxy_set_header X-User-Sub   $x_user_sub;
            proxy_set_header X-User-Role  $x_user_role;
            proxy_set_header x-organiser-id "";

            proxy_pass http://player_service/players/;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Match service ───────────────────────────────────────────────────
        location /api/matches/ {
            auth_request /_auth_validate;

            auth_request_set $x_user_sub   $upstream_http_x_user_sub;
            auth_request_set $x_user_role  $upstream_http_x_user_role;

            proxy_set_header X-User-Sub   $x_user_sub;
            proxy_set_header X-User-Role  $x_user_role;
            proxy_set_header x-organiser-id "";

            proxy_pass http://match_service/matches/;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Stats service ───────────────────────────────────────────────────
        location /api/stats/ {
            proxy_pass http://stats_service/stats/;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header X-User-Sub  "";
            proxy_set_header X-User-Role "";
        }

        # ── Notification service ────────────────────────────────────────────
        location /api/notifications/ {
            auth_request /_auth_validate;

            auth_request_set $x_user_sub  $upstream_http_x_user_sub;

            proxy_set_header X-User-Sub  $x_user_sub;
            proxy_set_header x-organiser-id "";

            proxy_pass http://notification_service/notifications/;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Frontend (catch-all) ────────────────────────────────────────────
        location / {
            proxy_pass http://frontend/;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
