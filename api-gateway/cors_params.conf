# Included by API locations only — the frontend catch-all is same-origin and
# doesn't need this. $cors_origin is "" for unrecognized origins, so the
# Allow-Origin header is empty and the browser still blocks the request.
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Vary "Origin" always;

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Content-Length 0;
    add_header Content-Type "text/plain charset=UTF-8";
    return 204;
}
