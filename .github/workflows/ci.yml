name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - player-service
          - tournament-service
          - match-service
          - stats-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: npm test

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - match-service
          - stats-service
          - notification-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tennis
          POSTGRES_PASSWORD: tennis_secret
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Run integration tests against real Postgres
        working-directory: ${{ matrix.service }}
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://tennis:tennis_secret@localhost:5432/test
